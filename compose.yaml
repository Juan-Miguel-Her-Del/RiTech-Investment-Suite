services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ritech}
      POSTGRES_DB: ${POSTGRES_DB:-ritech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ritech}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ritech}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      MARKET_PROVIDER: ${MARKET_PROVIDER:-demo}
      MARKET_API_KEY: ${MARKET_API_KEY:-}
      MARKET_SYMBOL: ${MARKET_SYMBOL:-NDX}
      MARKET_TIMEOUT_SECONDS: ${MARKET_TIMEOUT_SECONDS:-8}
      MARKET_CACHE_SECONDS: ${MARKET_CACHE_SECONDS:-60}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
